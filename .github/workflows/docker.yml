# ponytail: build baked image on GitHub's runners, push to GHCR, Vast pulls it.
# Push contents of lfm350m-vi/ as repo root, image lands at ghcr.io/<owner>/<repo>:latest.
name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - train_pilot.py
      - eval_gate.py
      - prep_data.py
      - train.ipynb
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
